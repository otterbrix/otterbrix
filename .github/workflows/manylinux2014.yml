name: manylinux2014

on:
  push:
    paths-ignore:
      - '**.md'
    tags:
      - '*'
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-info:
    name: Build info
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python-versions: ${{ steps.setVariables.outputs.matrix }}
    steps:
      - id: setVariables
        run: |
          echo 'matrix=["3.9", "3.10", "3.11"]' >> $GITHUB_OUTPUT

  build-wheel:
    name: Build native wheel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-info]
    strategy:
      fail-fast: true
      matrix:
        PYTHON_VERSION: ${{ fromJson(needs.build-info.outputs.python-versions) }}

    container: quay.io/pypa/manylinux_2_28_x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Set env
        run: |
          export PYTHON_SHORT_VERSION=$(echo '${{ matrix.PYTHON_VERSION }}' | tr -d '.')
          echo "PYTHON_SHORT_VERSION=${PYTHON_SHORT_VERSION}" >> $GITHUB_ENV 
          export PYTHON_PATH=/opt/python/cp${PYTHON_SHORT_VERSION}-cp${PYTHON_SHORT_VERSION}
          export PATH=$PYTHON_PATH:$PYTHON_PATH/bin:$PATH
          echo "PYTHON_PATH=${PYTHON_PATH}" >> $GITHUB_ENV 
          echo "PATH=${PATH}" >> $GITHUB_ENV

      - name: Install system packages
        run: |
          yum install -y ninja-build python3-pip python3-devel wget unzip zip

      - name: Set env conan dependencies
        run: |
          "$PYTHON_PATH/bin/python" -m pip install --user --retries=30 --upgrade pip
          "$PYTHON_PATH/bin/python" -m pip install --user --retries=30 conan==2.30.0

      - name: Add user local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Use conan
        run: |
          conan profile detect --force
          conan remote add otterbrix https://conan.otterbrix.com --allowed-packages "actor-zeta/*"
          echo "CONAN_COMPILER=$(sed -n 's/^compiler=//p; s/^compiler\.version=//p' "$(conan config home)/profiles/default" | paste -sd- -)" >> "$GITHUB_ENV"

      - name: Cache conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-manylinux_2_28-release-python-${{ env.CONAN_COMPILER }}-${{ hashFiles('conanfile.py', 'profiles/**') }}
          restore-keys: conan-manylinux_2_28-release-python-${{ env.CONAN_COMPILER }}-

      - name: Download and Install conan dependencies
        run: |
          python${{ matrix.PYTHON_VERSION }} -m pip install --user --retries=30 --upgrade pip
          python${{ matrix.PYTHON_VERSION }} -m pip install --user --retries=30 build pytest==6.2.5
          
          conan install . -pr:h profiles/release -pr:b default --build=missing --build="m4/*" -of build/wheel -o build_python=True
          conan cache clean "*" --source --build --download --temp

      - name: Build wheel
        run: |
          export CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=$PWD/build/wheel/generators/conan_toolchain.cmake"
          
          cp integration/python/otterbrix/pyproject.toml .
          python${{ matrix.PYTHON_VERSION }} -m build --wheel --outdir dist .

      - name: Repair wheel
        run: |
          for whl in dist/otterbrix*.whl; do
            auditwheel repair ${whl} -w ./work/dist/
            rm ${whl};
          done

      - name: Save library
        uses: actions/upload-artifact@v4
        with:
          name: artifact-wheel-${{ env.PYTHON_SHORT_VERSION }}
          path: ./work/dist/otterbrix*cp${{ env.PYTHON_SHORT_VERSION }}*.whl

  test-wheel:
    name: Test wheel
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 20
    needs: [build-wheel, build-info]
    strategy:
      fail-fast: true
      matrix:
        operating-system: [ubuntu-22.04]
        python-version: ${{ fromJson(needs.build-info.outputs.python-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set env
        run: |
          export PYTHON_SHORT_VERSION=$(echo '${{ matrix.python-version }}' | tr -d '.')
          echo "PYTHON_SHORT_VERSION=${PYTHON_SHORT_VERSION}" >> $GITHUB_ENV

      - name: Install test dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv
          pip3 install --retries=30 pytest==6.2.5
          # DataFrame ingest tests cover the full pandas/polars/arrow matrix.
          # All pandas/numpy ingestion routes through pandas' __arrow_c_stream__
          # (pandas>=2.2, hard-requires pyarrow); polars and pyarrow are needed so
          # their importorskip-guarded tests actually run in CI instead of being skipped.
          # pandas<4 allows pandas 3 (Python>=3.11 runners), so CI exercises it for real.
          pip3 install --retries=30 numpy "pandas>=2.2,<4" polars "pyarrow>=14.0.0"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-wheel-${{ env.PYTHON_SHORT_VERSION }}
          path: ./app

      - name: Inspect artifacts
        run: |
          ls -l ./app/*whl

      - name: Install package from wheel
        run: |
          python3 --version
          pip3 install --retries=30 ./app/otterbrix-*.whl

      - name: Test package imports
        run: |
          python3 -c "import distutils.sysconfig as sysconfig; print(sysconfig.get_config_var('LIBDIR'))"
          python3 -c "from otterbrix import Client, Connection, Cursor, connect"

      - name: Run pytest
        run: |
          pytest

  upload-wheel:
    name: Upload wheel
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 15
    needs: [test-wheel, build-info]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-22.04]
        python-version: ${{ fromJson(needs.build-info.outputs.python-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set env
        run: |
          export PYTHON_SHORT_VERSION=$(echo '${{ matrix.python-version }}' | tr -d '.')
          echo "PYTHON_SHORT_VERSION=${PYTHON_SHORT_VERSION}" >> $GITHUB_ENV

      - name: Install pip3
        run: |
          sudo apt update
          sudo apt install -y python3-pip

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-wheel-${{ env.PYTHON_SHORT_VERSION }}
          path: ./app

      - name: Inspect artifacts
        run: |
          ls -l ./app/*whl

      - name: Install twine
        run: |
          pip3 install --retries=30 twine

      - name: Publish wheels
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        working-directory: ./app
        run: |
          echo "Pretend to upload"
          twine upload --skip-existing *