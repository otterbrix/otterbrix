name: ubuntu 22.04 thread sanitizer

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  run:
    name: Run
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y build-essential ninja-build python3-pip curl gnupg apt-transport-https flex bison g++-12

      - name: conan installation and configuration
        run: |
          pip install conan==2.15.0
          conan profile detect --force
          conan remote add otterbrix http://conan.otterbrix.com

      - name: download dependencies
        run: |
          mkdir build && cd build
          cp ../conanfile.py .
          # actor-zeta is rebuilt from source with -fsanitize=thread: its mailbox CAS lives
          # out-of-line in the prebuilt archive, and an uninstrumented dependency makes the
          # sender-to-actor happens-before edge invisible. See .github/tsan-deps.profile
          conan install . --build missing --build="actor-zeta/*" \
            -pr:h ../.github/tsan-deps.profile \
            -s build_type=Release -s compiler.cppstd=20

      # TSan runtime aborts with "unexpected memory mapping" under high-entropy ASLR
      - name: Reduce ASLR entropy for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: build
        run: |
          cd build
          cmake  -G Ninja -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_TOOLCHAIN_FILE=./build/Release/generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DDEV_MODE=ON -DEXAMPLE=ON -DENABLE_TSAN=ON ..
          cmake --build .

      - name: Test
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/tsan-suppressions.txt second_deadlock_stack=1
        run: |
          cd build
          ctest -C Release --output-on-failure
