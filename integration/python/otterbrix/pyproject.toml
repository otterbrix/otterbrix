[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.10.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "otterbrix"
version = "1.0.1a9"
description = "Otterbrix: computation framework for Semi-structured data processing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Otterbrix Team", email = "team@otterbrix.com" },
]
dependencies = [
    "numpy",
    "pandas>=2.2,<4",
    "pyarrow>=14.0.0",
    "typing_extensions",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
test = ["pytest"]

# CI copies this file to the repo root and builds there, so source-dir is "." (top-level CMakeLists.txt)
[tool.scikit-build]
cmake.version = ">=3.20"
cmake.source-dir = "."
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
build.verbose = true
# The wheel is populated by the CMake install() rules under if(SKBUILD), not a Python package.
wheel.packages = []

[tool.scikit-build.cmake.define]
BUILD_PYTHON = "ON"

[tool.pytest.ini_options]
testpaths = ["integration/python/tests"]
addopts = [
    "--import-mode=importlib",
]
